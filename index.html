<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bai Bai bn iu nhó</title>
<style>
  :root { --bg:#000; --pink:#ff4fa3; box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hint { position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom,0px)); text-align:center;
    color:#ff4fa3aa; font:14px/1.4 "Segoe UI",system-ui,sans-serif; pointer-events:none; letter-spacing:.04em; transition:opacity 1s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">chạm hai lần vào màn hình ♡</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr, particles = [], hearts = [], stars = [], mouse = {x:-999,y:-999}, phase = 0;
const PHRASES = ['Bai Bai bn iu nhó', 'Chúc Bạn Ngủ Ngon'];
let cur = 0, t0 = performance.now();

function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildTargets(PHRASES[cur], true);
  stars = Array.from({length:70}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.2+.3, p:Math.random()*6}));
}

function buildTargets(text, init){
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d');
  const words = text.split(' ');
  const mobile = W < 600;
  // chia dòng: điện thoại 2 dòng, máy tính 1 dòng
  const lines = mobile ? [words.slice(0, Math.ceil(words.length/2)).join(' '), words.slice(Math.ceil(words.length/2)).join(' ')] : [text];
  let fs = Math.min(W / (mobile ? 6.2 : 11.5), 150);
  o.font = `800 ${fs}px "Segoe UI",Arial,sans-serif`;
  o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  const lh = fs*1.15;
  lines.forEach((l,i) => o.fillText(l, W/2, H/2 + (i-(lines.length-1)/2)*lh));
  const d = o.getImageData(0,0,W,H).data;
  const gap = Math.max(4, Math.round(fs/17));
  const pts = [];
  for(let y=0;y<H;y+=gap) for(let x=0;x<W;x+=gap){
    if(d[(y*W+x)*4+3] > 128) pts.push({x,y});
  }
  // trộn để chuyển chữ mượt hơn
  pts.sort(()=>Math.random()-.5);
  while(particles.length < pts.length){
    const a = Math.random()*6.28, r = Math.max(W,H)*(.5+Math.random()*.4);
    particles.push({x:W/2+Math.cos(a)*r, y:H/2+Math.sin(a)*r, vx:0, vy:0, tx:W/2, ty:H/2, s:1, ph:Math.random()*6.28, hue:0});
  }
  particles.forEach((p,i) => {
    const q = pts[i % pts.length];
    p.tx = q.x; p.ty = q.y;
    p.s = (gap*0.28) + Math.random()*gap*0.12;
    p.hue = Math.random();
    p.extra = i >= pts.length; // hạt dư
  });
  if(particles.length > pts.length) particles.length = pts.length;
  gapSize = gap;
}
let gapSize = 6;

function heartPath(c, x, y, s){
  c.beginPath();
  c.moveTo(x, y + s*.35);
  c.bezierCurveTo(x, y, x - s*.5, y, x - s*.5, y + s*.35);
  c.bezierCurveTo(x - s*.5, y + s*.7, x, y + s*.85, x, y + s*1.05);
  c.bezierCurveTo(x, y + s*.85, x + s*.5, y + s*.7, x + s*.5, y + s*.35);
  c.bezierCurveTo(x + s*.5, y, x, y, x, y + s*.35);
  c.closePath();
}
function spawnHeart(initial){
  hearts.push({
    x: Math.random()*W, y: initial ? Math.random()*H : H + 30,
    s: 10 + Math.random()*30, vy: .3 + Math.random()*.9,
    sw: Math.random()*6, sa: 10 + Math.random()*25,
    a: .25 + Math.random()*.6, rot: (Math.random()-.5)*.6,
    c: ['#ff4fa3','#ff7ab8','#ff2d87','#ffb3d6','#ff5c8a'][Math.floor(Math.random()*5)],
    glow: Math.random() > .5
  });
}
for(let i=0;i<34;i++) spawnHeart(true);

function frame(now){
  const t = (now - t0)/1000;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0,0,W,H);

  // sao lấp lánh
  stars.forEach(s => {
    ctx.globalAlpha = .25 + .35*Math.sin(t*1.5 + s.p);
    ctx.fillStyle = '#ffd1e8'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  });

  // tim bay
  if(Math.random() < .08) spawnHeart(false);
  hearts = hearts.filter(h => h.y > -60);
  hearts.forEach(h => {
    h.y -= h.vy;
    const x = h.x + Math.sin(t*1.2 + h.sw)*h.sa;
    ctx.save();
    ctx.translate(x, h.y); ctx.rotate(h.rot + Math.sin(t + h.sw)*.15); ctx.translate(-x, -h.y);
    ctx.globalAlpha = h.a * Math.min(1, h.y/120 + .2);
    ctx.fillStyle = h.c;
    if(h.glow){ ctx.shadowColor = h.c; ctx.shadowBlur = 18; }
    heartPath(ctx, x, h.y, h.s); ctx.fill();
    ctx.restore();
  });

  // chữ bằng chấm, bay lơ lửng
  const floatY = Math.sin(t*1.1)*10, floatX = Math.sin(t*.7)*6;
  ctx.shadowColor = '#ff4fa3'; ctx.shadowBlur = 10;
  particles.forEach(p => {
    const tx = p.tx + floatX + Math.sin(t*2 + p.ph)*1.6;
    const ty = p.ty + floatY + Math.cos(t*2.2 + p.ph)*1.6;
    // đẩy ra khi chạm/di chuột
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx*dx + dy*dy;
    if(d2 < 6000){ const f = (1 - d2/6000)*6, d = Math.sqrt(d2)||1; p.vx += dx/d*f; p.vy += dy/d*f; }
    p.vx += (tx - p.x)*.045; p.vy += (ty - p.y)*.045;
    p.vx *= .86; p.vy *= .86;
    p.x += p.vx; p.y += p.vy;
    const tw = .75 + .25*Math.sin(t*3 + p.ph);
    ctx.globalAlpha = tw;
    ctx.fillStyle = p.hue < .12 ? '#ffd0e6' : (p.hue < .55 ? '#ff4fa3' : '#ff74b8');
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.28); ctx.fill();
  });
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// tạo vài trái tim nổ ra khi đổi chữ
function burst(x, y){
  for(let i=0;i<14;i++){
    hearts.push({x:x+(Math.random()-.5)*60, y:y+(Math.random()-.5)*60, s:12+Math.random()*26, vy:1+Math.random()*2.2,
      sw:Math.random()*6, sa:15+Math.random()*30, a:.8, rot:(Math.random()-.5)*.8, c:'#ff7ab8', glow:true});
  }
}

let lastTap = 0;
function toggle(x, y){
  cur = 1 - cur;
  buildTargets(PHRASES[cur]);
  // xô các hạt để chữ mới "nở" ra
  particles.forEach(p => { p.vx += (Math.random()-.5)*14; p.vy += (Math.random()-.5)*14; });
  burst(x, y);
  document.getElementById('hint').style.opacity = 0;
}
addEventListener('dblclick', e => toggle(e.clientX, e.clientY));
// hỗ trợ chạm hai lần trên điện thoại
addEventListener('touchend', e => {
  const now = Date.now(), tc = e.changedTouches[0];
  if(now - lastTap < 350){ e.preventDefault(); toggle(tc.clientX, tc.clientY); lastTap = 0; } else lastTap = now;
}, {passive:false});
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('touchmove', e => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', () => { mouse.x = mouse.y = -999; });
addEventListener('resize', resize);

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
